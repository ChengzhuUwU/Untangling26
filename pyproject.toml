[build-system]
requires = [
    "scikit-build-core>=0.9",
    "pybind11>=2.11",
    "ninja",
    "numpy",
]
build-backend = "scikit_build_core.build"

[project]
name = "untangling26"
version = "0.2"
description = "Type-Free Global Intersection Analysis with Linear Displacement Fields (SIGGRAPH Asia 2026)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "trimesh>=4.12.2",
]

[project.scripts]
untangling26 = "untangling26.cli:main"

[project.optional-dependencies]
# Tooling needed to (re)generate PythonBindings/python/lcs_py/__init__.pyi via
# the `stubs` cmake target. Install with `pip install -e .[dev]`.
dev = [
    "pybind11-stubgen>=2.5",
]
gui = [
    "polyscope",
]

[tool.scikit-build]
cmake.version = ">=3.26"
build-dir = "build/{wheel_tag}"
wheel.packages = ["PythonBindings/python/untangling26"]

[tool.cibuildwheel]
test-command = "python {project}/PythonBindings/tests/check_wheel.py && untangling26 --help"

[tool.cibuildwheel.macos]
repair-wheel-command = "delocate-wheel --require-archs {delocate_archs} -w {dest_dir} -v {wheel}"

[tool.cibuildwheel.windows]
repair-wheel-command = ""
